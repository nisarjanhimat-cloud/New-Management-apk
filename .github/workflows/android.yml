
      - name: Extract project
        run: unzip -o super_store_manager_source.zip

      - name: Fix PDF dependency
        working-directory: super_store_manager
        run: sed -i 's/pdf: \^3\.13\.1/pdf: ^3.12.0/' pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
